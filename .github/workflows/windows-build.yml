name: Windows Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "frpc-tray-windows-x64"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/frpc-tray.exe dist/
          Compress-Archive -Path dist/frpc-tray.exe -DestinationPath "$name.zip" -Force
          Write-Output "Created $name.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frpc-tray-windows-x64
          path: frpc-tray-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: frpc-tray-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
