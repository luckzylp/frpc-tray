name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag already pushed to the remote, e.g. v0.2.0 (create it first: git tag -a v0.2.0 -m 'v0.2.0' && git push origin v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PACKAGE: frpc-tray-windows-x64

jobs:
  release:
    name: Publish release (windows-latest)
    runs-on: windows-latest

    steps:
      # A manual run can reference a tag that was created locally but never pushed
      # (or simply mistyped). checkout@v4 then fails with the opaque message
      # "A branch or tag with the name ... could not be found". Fail early here
      # with an actionable message instead.
      - name: Verify tag exists on remote
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG#refs/tags/}"
          if [[ ! "$tag" =~ ^v[^/[:space:]]+$ ]]; then
            echo "::error::Invalid tag '$TAG'. Use the short tag name, e.g. v0.2.0"
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' is not available on ${GITHUB_REPOSITORY} (missing tag or no access)."
            echo "::error::Create and push it first: git tag -a $tag -m '$tag' && git push origin $tag"
            exit 1
          fi
          echo "Tag $tag found on ${GITHUB_REPOSITORY}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve and verify version
        id: meta
        shell: pwsh
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"

          if ($env:INPUT_TAG) {
            $tag = $env:INPUT_TAG -replace '^refs/tags/', ''
          } elseif ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF.Substring(10)
          } else {
            throw "No tag: push a v* tag or run the workflow with a tag input."
          }

          $match = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"(?<v>[^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Cannot read version from Cargo.toml" }
          $version = $match.Matches[0].Groups["v"].Value

          if ($tag -ne "v$version") {
            throw "Tag $tag does not match Cargo.toml version v$version"
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Output "Releasing $tag"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = $env:PACKAGE

          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/frpc-tray.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "$name.zip" -Force

          $hash = (Get-FileHash -Algorithm SHA256 -Path "$name.zip").Hash.ToLower()
          "$hash  $name.zip" | Set-Content -NoNewline -Encoding ascii SHA256SUMS.txt

          Write-Output "Packaged $name.zip"
          Get-Content SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            ${{ env.PACKAGE }}.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          files: |
            ${{ env.PACKAGE }}.zip
            SHA256SUMS.txt
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
