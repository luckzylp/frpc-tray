name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag already pushed to the remote, e.g. v0.2.0 (create it first: git tag -a v0.2.0 -m 'v0.2.0' && git push origin v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      # A manual run can reference a tag that was created locally but never
      # pushed. checkout@v4 then fails with an opaque "could not be found"
      # message, so fail early with an actionable hint instead.
      - name: Verify tag exists on remote
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG#refs/tags/}"
          if [[ ! "$tag" =~ ^v[^/[:space:]]+$ ]]; then
            echo "::error::Invalid tag '$TAG'. Use the short tag name, e.g. v0.2.0"
            exit 1
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "::error::Tag '$tag' is not available on ${GITHUB_REPOSITORY} (missing tag or no access)."
            echo "::error::Create and push it first: git tag -a $tag -m '$tag' && git push origin $tag"
            exit 1
          fi
          echo "Tag $tag found on ${GITHUB_REPOSITORY}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and verify version
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_TAG:-}" ]]; then
            tag="${INPUT_TAG#refs/tags/}"
          elif [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          else
            echo "::error::No tag: push a v* tag or run the workflow with a tag input."
            exit 1
          fi
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "::error::Cannot read version from Cargo.toml"
            exit 1
          fi
          if [[ "$tag" != "v$version" ]]; then
            echo "::error::Tag $tag does not match Cargo.toml version v$version"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

  build:
    needs: verify
    name: Build (${{ matrix.package }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: frpc-tray-windows-x64
          - os: ubuntu-latest
            package: frpc-tray-linux-x64
          - os: ubuntu-24.04-arm
            package: frpc-tray-linux-arm64
          - os: macos-15-intel
            package: frpc-tray-macos-x64
          - os: macos-latest
            package: frpc-tray-macos-arm64
    env:
      PACKAGE: ${{ matrix.package }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libayatana-appindicator3-dev libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/frpc-tray.exe dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath "$env:PACKAGE.zip" -Force
          Get-Item "$env:PACKAGE.zip" | Select-Object Name, Length

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist
          cp README.md LICENSE dist/
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            # Ship a real .app so Finder / LaunchAgents can launch it. The
            # LSUIElement key hides the Dock icon (the app is tray-only).
            app="dist/frpc-tray.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp target/release/frpc-tray "$app/Contents/MacOS/frpc-tray"
            chmod +x "$app/Contents/MacOS/frpc-tray"
            # printf (rather than a heredoc) keeps the XML free of YAML
            # block-scalar indentation, which would break the XML declaration.
            printf '%s\n' \
              '<?xml version="1.0" encoding="UTF-8"?>' \
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
              '<plist version="1.0">' \
              '<dict>' \
              '<key>CFBundleName</key><string>frpc-tray</string>' \
              '<key>CFBundleDisplayName</key><string>frpc-tray</string>' \
              '<key>CFBundleIdentifier</key><string>cn.luckzylp.frpc-tray</string>' \
              '<key>CFBundleExecutable</key><string>frpc-tray</string>' \
              '<key>CFBundlePackageType</key><string>APPL</string>' \
              "<key>CFBundleVersion</key><string>${VERSION}</string>" \
              "<key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
              '<key>LSMinimumSystemVersion</key><string>10.15</string>' \
              '<key>LSUIElement</key><true/>' \
              '<key>NSHighResolutionCapable</key><true/>' \
              '</dict>' \
              '</plist>' \
              > "$app/Contents/Info.plist"
            tar -czf "$PACKAGE.tar.gz" -C dist frpc-tray.app README.md LICENSE
          else
            cp target/release/frpc-tray dist/
            tar -czf "$PACKAGE.tar.gz" -C dist frpc-tray README.md LICENSE
          fi
          ls -lh "$PACKAGE.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: |
            ${{ matrix.package }}.zip
            ${{ matrix.package }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [verify, build]
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: frpc-tray-*
          merge-multiple: true
          path: dist

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' \) -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(needs.verify.outputs.tag, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
