[package]
name = "frpc-tray"
version = "0.3.0"
edition = "2024"

[dependencies]
tray-icon = "0.26"
tao = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
zip = "8.6"
flate2 = "1"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
single-instance = "0.3"

# Windows-only: HKCU Run registry key and the icon/application manifest resource.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
