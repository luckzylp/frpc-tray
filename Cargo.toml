[package]
name = "frpc-tray"
version = "0.1.0"
edition = "2024"

[dependencies]
tray-icon = "0.26"
tao = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
zip = "8.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.56"
single-instance = "0.3"

[build-dependencies]
embed-resource = "3"
